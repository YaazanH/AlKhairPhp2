services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: alkhairapp:production
    env_file:
      - .env.docker
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env.docker:/var/www/html/.env
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped

  queue:
    image: alkhairapp:production
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    user: "33:33"
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--timeout=120", "--sleep=3"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./.env.docker:/var/www/html/.env
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped

  scheduler:
    image: alkhairapp:production
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    user: "33:33"
    command: ["laravel-scheduler"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./.env.docker:/var/www/html/.env
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-alkhairapp}
      MYSQL_USER: ${DB_USERNAME:-alkhair}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  app_storage:
  app_cache:
